name: Policy Checks

on:
  pull_request:
    branches: [main, staging, development]

jobs:
  policy:
    name: Policy & Barrel Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Barrel compliance
        run: pnpm check:barrels

      - name: Deep-import policy
        run: pnpm check:policy

      - name: UI format check
        run: pnpm check:ui-format
