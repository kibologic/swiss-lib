name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write  # required for npm Trusted Publishing (OIDC)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # This only affects the CI tooling runtime, not the published packages'
      # own `engines` requirement.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing (OIDC) requires npm >=11.5.1; the bundled
      # version on this runner/Node setup is older. Pinned to the npm 11.x
      # major (not `npm@latest`): a prior version of this step used
      # `npm@latest`, which silently broke this workflow once npm 12 shipped
      # and raised its own Node requirement past what this job's Node version
      # supported -- a floating tag for a required piece of release tooling
      # is exactly the kind of thing that should be pinned, not chased.
      - name: Update npm for Trusted Publishing support
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @swissjs/cli is excluded from the main build below but components'
      # own build script imports its compiled output
      # (@swissjs/cli/dist/utils/compileUiFiles.js) directly, so it must be
      # built first.
      - name: Build @swissjs/cli
        run: pnpm --filter "@swissjs/cli" run build

      # Uses pnpm's own recursive build (-r), not turbo: turbo's task-spawn
      # mechanism is intermittently unreliable in this repo -- confirmed both
      # locally and in this exact CI environment, failing a DIFFERENT random
      # package each time ("unable to spawn child process: No such file or
      # directory (os error 2)"), with @swissjs/security failing
      # deterministically every time regardless of concurrency settings.
      # Root cause not isolated despite investigation (not the build scripts,
      # not package-level .npmrc/packageManager/engines fields, not
      # concurrency=1). Plain `pnpm -r run build` has been 100% reliable in
      # every test against this repo -- a different code path from turbo's
      # task graph entirely.
      - name: Build
        run: pnpm -r --filter="!@swissjs/css" --filter="!@swissjs/cli" run build

      # No NODE_AUTH_TOKEN: publishing uses npm Trusted Publishing (OIDC),
      # configured per-package on npmjs.com to trust this exact repo +
      # workflow file. Leaving a token env var here would make npm prefer
      # the token over OIDC.
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
