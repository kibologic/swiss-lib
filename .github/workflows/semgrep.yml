name: Semgrep Security Scan

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep --config .semgrep.yml --error --json --output semgrep-report.json . || true

      - name: Fail on ERROR severity findings
        run: |
          python3 -c "
          import json, os, sys

          if not os.path.exists('semgrep-report.json'):
              print('No report generated')
              sys.exit(0)

          with open('semgrep-report.json') as f:
              report = json.load(f)

          errors = [r for r in report.get('results', []) if r.get('extra', {}).get('severity') == 'ERROR']
          if errors:
              print(f'{len(errors)} Semgrep ERROR(s) found:')
              for e in errors:
                  print(f\"{e['path']}:{e['start']['line']} — {e['extra']['message']}\")
              sys.exit(1)

          print('Semgrep scan passed.')
          "
